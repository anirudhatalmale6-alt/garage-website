; Photo uploads for the Stock Manager.
;
; A car can carry 30 photos and phone cameras produce 4–8 MB files, so the
; stock PHP limits (20 files, 8 MB post) silently threw most of a batch away.
; The site resizes everything down to 1600px after it lands, so nothing this
; large is ever stored.

max_file_uploads = 40
upload_max_filesize = 24M
post_max_size = 220M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
